<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Packs</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#000;
color:#fff;
text-align:center;
padding:40px;
}

h1{
font-size:60px;
margin:0;
}

.pack{
background:white;
margin:30px;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.titulo{
background:#942D83;
color:white;
padding:20px;
font-size:40px;
text-align:center;
font-weight:bold;
}

.texto{
padding:40px;
font-size:40px;
text-align:center;
}

</style>
</head>

<body>

<div class="header">

<h1 id="tituloPrincipal">
PACKS ESMORZARS
</h1>

</div>

<div class="pack">
<div class="titulo">PACK Nº1</div>

<div class="texto" id="pack1"></div>
</div>

<div class="pack">
<div class="titulo">PACK Nº2</div>

<div class="texto" id="pack2"></div>
</div>

<div class="pack">
<div class="titulo">PACK Nº3</div>

<div class="texto" id="pack3"></div>
</div>

<script>

const params =
new URLSearchParams(window.location.search);

const idioma =
params.get("lang") || "cat";

if(idioma==="cat"){

document.getElementById("tituloPrincipal").innerHTML =
"PACKS ESMORZARS";

document.getElementById("pack1").innerHTML =
"Cafè amb llet + Pasta + Suc natural";

document.getElementById("pack2").innerHTML =
"Cafè amb llet + Mini entrepà + Suc natural";

document.getElementById("pack3").innerHTML =
"Cafè amb llet + Entrepà calent + Suc natural";

}else{

document.getElementById("tituloPrincipal").innerHTML =
"PACKS ALMUERZOS";

document.getElementById("pack1").innerHTML =
"Café con leche + Pasta + Zumo natural";

document.getElementById("pack2").innerHTML =
"Café con leche + Mini bocadillo + Zumo natural";

document.getElementById("pack3").innerHTML =
"Café con leche + Bocadillo caliente + Zumo natural";

}

function comprobarRetorno(){

const bloque =
Math.floor(Date.now()/15000)%6;

if(bloque<4){

window.location.href="index.html";

}

}

setInterval(comprobarRetorno,1000);

</script>

</body>
</html>
